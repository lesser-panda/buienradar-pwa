<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rain – Buienradar forecast</title>
<meta name="description" content="Rain forecast for the Netherlands and Belgium, with temperature, wind, UV, sun and pollen.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button id="placeBtn" class="place" aria-label="Change location"><span class="pin" aria-hidden="true">◎</span><span id="placeName">Haarlem</span><span class="caret" aria-hidden="true">▾</span></button>
    <div class="top-right"><span id="updated" class="muted small"></span><button id="langBtn" class="lang" type="button">NL</button><button id="refresh" class="icon-btn" aria-label="Refresh">⟳</button></div>
  </header>

  <main class="grid">
    <section class="card now" id="nowCard" hidden>
      <img id="nowIcon" alt="" width="64" height="64">
      <div id="nowTemp" class="temp">–</div>
      <div class="now-text"><div id="nowDesc" class="now-desc"></div><div id="nowSub" class="muted small"></div></div>
    </section>

    <section class="card rain" id="rainCard">
      <div class="head-row">
        <h1 id="rainHead">Loading…</h1>
        <button id="layerBtn" class="pill" hidden aria-haspopup="listbox">Rain ▾</button>
      </div>
      <div id="rainSub" class="muted sub"></div>
      <div id="chips" class="chips" role="tablist" hidden></div>
      <div class="chart-wrap"><canvas id="chart" aria-label="Forecast chart. Drag across it for a reading."></canvas></div>
    </section>

    <section class="card radar" id="radarCard">
      <div class="label" id="radarLabel">RADAR</div>
      <div class="radar-frame"><img id="radarImg" alt="" hidden width="550" height="512"><div id="radarStatus" class="radar-status muted small"></div><div id="radarNote" class="radar-note" hidden></div></div>
    </section>

    <section class="card outlook" id="outlookCard" hidden>
      <div class="label" id="outlookLabel">OUTLOOK</div>
      <p id="outlook"></p>
    </section>

    <section class="card days" id="daysCard" hidden></section>
  </main>

  <footer id="footer" class="foot muted small"></footer>
</div>

<div id="layerMenu" class="menu" hidden role="listbox"></div>

<dialog id="search">
  <form method="dialog" class="search-head">
    <input id="q" type="search" placeholder="Search a town in NL or BE" autocomplete="off" enterkeyhint="search" aria-label="Search a town">
    <button class="icon-btn" value="close" aria-label="Close">✕</button>
  </form>
  <button id="gps" class="gps" type="button">◎ Use my location</button>
  <ul id="results" class="results"></ul>
  <div id="searchMsg" class="muted small"></div>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
